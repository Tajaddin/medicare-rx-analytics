name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.1"

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked --all-extras
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Python tests against the emulator (coverage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked --all-extras
      - run: uv run pytest --cov=rx --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml, retention-days: 14 }

  bash:
    name: shellcheck and bats
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - run: shellcheck scripts/*.sh
      - run: bats tests/bats

  dbt:
    name: load, dbt build and BI exports on the CI sample (fakesnow)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked --all-extras
      - name: emulator
        run: |
          nohup uv run fakesnow -s -p 8085 > fakesnow.log 2>&1 &
          for _ in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/8085) 2>/dev/null && exit 0; sleep 1; done
          cat fakesnow.log; exit 1
      - name: load the sample of real CMS pages
        run: |
          uv run rx bootstrap
          uv run rx plan | while IFS=$'\t' read -r dataset year id state; do
            uv run rx load --dataset "$dataset" --year "$year" --pages "tests/fixtures/pages/$dataset/$year"
          done
      - name: dbt build (seed, models, tests)
        run: cd dbt && DBT_PROFILES_DIR=. uv run dbt build
      - name: export the marts, verify the Tableau extract
        run: |
          uv run rx export
          python3 -c "import json; r = json.load(open('reports/exports.json')); assert r['hyper']['ok'], r"
      - name: Power BI project equals one regenerated from the exports
        run: uv run python scripts/make_powerbi.py && git diff --exit-code -- bi/powerbi
      - name: Power BI files against Microsoft's JSON schemas
        run: uv run bash scripts/validate_pbir.sh

  security:
    name: secrets and dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv sync --locked --all-extras
      - run: uv run pip-audit --skip-editable --progress-spinner off
